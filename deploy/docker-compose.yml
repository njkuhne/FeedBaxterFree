# FEEDBAXTER_PORT is the host port (default 8080). Run from the repo root with
#   FEEDBAXTER_PORT=8095 docker compose -f deploy/docker-compose.yml up -d --build
# (the shell supplies it; .env is only read when compose runs from its own directory).
services:
  feedbaxter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: feedbaxter:latest
    ports:
      - "${FEEDBAXTER_PORT:-8080}:8080"
    volumes:
      - feedbaxter-data:/data
    env_file:
      - path: ../.env
        required: false
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  feedbaxter-data:
